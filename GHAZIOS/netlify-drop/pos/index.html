<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHAZIOS POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pos-styles.css">
</head>
<body>
    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-text">GHAZIOS</div>
                <div class="login-subtitle">Point of Sale</div>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Restaurant</label>
                    <select id="tenantSelect" required>
                        <option value="">Select Restaurant</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- POS MAIN -->
    <div class="pos-app" id="posApp" style="display:none">
        <!-- TOP BAR -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="topbar-logo">GHAZIOS</div>
                <div class="topbar-divider"></div>
                <div class="topbar-restaurant" id="restaurantName"></div>
                <div class="topbar-divider"></div>
                <div class="topbar-clock" id="clock"></div>
            </div>
            <div class="topbar-right">
                <button class="topbar-btn" id="refreshBtn" title="Refresh">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
                <button class="topbar-btn" id="ordersBtn" title="View Orders">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span class="btn-badge" id="pendingBadge" style="display:none">0</span>
                </button>
                <div class="topbar-user">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <span class="user-name" id="userName">Admin</span>
                </div>
                <button class="topbar-btn logout" id="logoutBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <!-- MAIN: 3 COLUMNS -->
        <main class="main">
            <!-- LEFT: Ready Orders -->
            <aside class="ready-panel" id="readyPanel">
                <div class="ready-header">
                    <span>🟢</span>
                    <span>Ready for Pickup</span>
                    <span class="ready-count" id="readyCount">0</span>
                </div>
                <div class="ready-list" id="readyList">
                    <div class="ready-empty">No orders ready</div>
                </div>
            </aside>

            <!-- CENTER: Menu -->
            <section class="menu-panel">
                <div class="menu-cats" id="menuCats">
                    <button class="cat active" data-cat="all">All</button>
                </div>
                <div class="menu-grid" id="menuGrid">
                    <div class="menu-loading">Loading...</div>
                </div>
            </section>

            <!-- RIGHT: Cart -->
            <section class="cart-panel">
                <div class="cart-head">
                    <div class="cart-head-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        <span>Order</span>
                        <span class="cart-count" id="cartCount">0</span>
                    </div>
                    <button class="btn-clear" id="clearBtn">Clear</button>
                </div>
                <div class="customer-box">
                    <div class="cust-row">
                        <div class="cust-field">
                            <label>Name <span class="req">*</span></label>
                            <input type="text" id="custName" placeholder="Customer name">
                        </div>
                        <div class="cust-field">
                            <label>Phone</label>
                            <div class="phone-box">
                                <span class="phone-code">+230</span>
                                <input type="tel" id="custPhone" placeholder="5123 4567" maxlength="9">
                            </div>
                        </div>
                    </div>
                    <div class="cust-field">
                        <label>Notes</label>
                        <input type="text" id="custNotes" placeholder="Special instructions...">
                    </div>
                </div>
                <div class="cart-items" id="cartItems">
                    <div class="cart-empty">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        <p>Tap items to add</p>
                    </div>
                </div>
                <div class="pay-area">
                    <div class="pay-summary">
                        <div class="pay-row"><span>Subtotal</span><span id="paySub">Rs 0.00</span></div>
                        <div class="pay-row"><span>Tax (15%)</span><span id="payTax">Rs 0.00</span></div>
                        <div class="pay-row pay-total"><span>Total</span><span id="payTotal">Rs 0.00</span></div>
                    </div>
                    <div class="pay-methods">
                        <button class="pay-opt active" data-method="cash">💵 Cash</button>
                        <button class="pay-opt" data-method="card">💳 Card</button>
                        <button class="pay-opt" data-method="mobile">📱 Mobile</button>
                    </div>
                    <button class="btn-order" id="orderBtn" disabled>Place Order</button>
                </div>
            </section>
        </main>
    </div>

    <!-- ORDERS MODAL -->
    <div class="overlay" id="ordersOverlay">
        <div class="modal modal-lg">
            <div class="modal-head">
                <h3>Orders</h3>
                <button class="modal-x" id="closeOrders">✕</button>
            </div>
            <div class="modal-content">
                <div class="ord-tabs">
                    <button class="ord-tab active" data-st="walkin">Walk-in</button>
                    <button class="ord-tab" data-st="online">Online</button>
                </div>
                <div class="ord-status-filter">
                    <button class="sf active" data-filter="all">All</button>
                    <button class="sf" data-filter="pending">Pending</button>
                    <button class="sf" data-filter="confirmed">Preparing</button>
                    <button class="sf" data-filter="ready">Ready</button>
                </div>
                <div class="ord-list" id="ordList"></div>
            </div>
        </div>
    </div>

    <!-- RECEIPT MODAL -->
    <div class="overlay" id="receiptOverlay">
        <div class="modal">
            <div class="modal-head">
                <h3>Order Complete</h3>
                <button class="modal-x" id="closeReceipt">✕</button>
            </div>
            <div class="modal-content">
                <div class="receipt-ok">✓</div>
                <p class="receipt-inv" id="receiptInv"></p>
                <div class="receipt-paper" id="receiptPaper"></div>
                <div class="receipt-actions">
                    <button class="ra-btn print" id="printBtn">🖨️ Print Receipt</button>
                    <button class="ra-btn new" id="newOrderBtn">New Order</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toasts" id="toasts"></div>

    <script src="pos-app.js"></script>
</body>
</html>
