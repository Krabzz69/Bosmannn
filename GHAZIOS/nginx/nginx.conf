events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name _;

        # Ordering Website (Customer Portal)
        location / {
            root /usr/share/nginx/html/website;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # POS System
        location /pos {
            alias /usr/share/nginx/html/pos;
            index index.html;
            try_files $uri $uri/ /pos/index.html;
        }

        # Kitchen Display
        location /kitchen {
            alias /usr/share/nginx/html/kitchen;
            index index.html;
            try_files $uri $uri/ /kitchen/index.html;
        }

        # Admin Panel
        location /admin {
            alias /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # API Proxy
        location /api/ {
            proxy_pass http://ghazios-backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Socket.IO Proxy
        location /socket.io/ {
            proxy_pass http://ghazios-backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
