services:
  db:
    image: postgres:15-alpine
    container_name: ghazios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghazios_db
      POSTGRES_USER: ghazios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - ghazios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghazios -d ghazios_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghazios-backend
    restart: unless-stopped
    environment:
      PORT: 4001
      NODE_ENV: production
      DATABASE_URL: postgresql://ghazios:${POSTGRES_PASSWORD:?}@db:5432/ghazios_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./receipts:/app/receipts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ghazios-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  nginx-ordering:
    image: nginx:alpine
    container_name: ghazios-ordering
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx/ordering.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ghazios-network
    deploy:
      resources:
        limits:
          memory: 64M

  nginx-pos:
    image: nginx:alpine
    container_name: ghazios-pos
    restart: unless-stopped
    volumes:
      - ./pos:/usr/share/nginx/html:ro
      - ./nginx/pos.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ghazios-network
    deploy:
      resources:
        limits:
          memory: 64M

  nginx-kitchen:
    image: nginx:alpine
    container_name: ghazios-kitchen
    restart: unless-stopped
    volumes:
      - ./kitchen:/usr/share/nginx/html:ro
      - ./nginx/kitchen.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ghazios-network
    deploy:
      resources:
        limits:
          memory: 64M

  nginx-admin:
    image: nginx:alpine
    container_name: ghazios-admin
    restart: unless-stopped
    volumes:
      - ./admin:/usr/share/nginx/html:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8003:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ghazios-network
    deploy:
      resources:
        limits:
          memory: 64M

  nginx-superadmin:
    image: nginx:alpine
    container_name: ghazios-superadmin
    restart: unless-stopped
    volumes:
      - ./superadmin:/usr/share/nginx/html:ro
      - ./nginx/superadmin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8004:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ghazios-network
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:

networks:
  ghazios-network:
    driver: bridge
